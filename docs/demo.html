<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaOS Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 25, 40, 0.9);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            padding: 40px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #64c8ff, #b344ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
        }

        .demo-section {
            background: rgba(30, 40, 70, 0.6);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .demo-section h2 {
            color: #64c8ff;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .feature-card {
            background: rgba(20, 30, 50, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .feature-card:hover {
            border-color: rgba(100, 200, 255, 0.6);
            background: rgba(30, 50, 80, 0.9);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.2);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature-name {
            font-weight: 600;
            color: #64c8ff;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 12px;
            color: #888;
        }

        .carousel {
            position: relative;
            background: rgba(10, 20, 40, 0.8);
            border-radius: 15px;
            overflow: hidden;
            padding: 30px;
            text-align: center;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .carousel-content {
            animation: slideInContent 0.5s ease-out;
        }

        @keyframes slideInContent {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-number {
            font-size: 48px;
            color: #64c8ff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .step-title {
            font-size: 28px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .step-description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .carousel-nav {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            background: linear-gradient(135deg, #64c8ff, #b344ff);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .prev-btn, .next-btn {
            width: 50px;
            padding: 12px;
        }

        .skip-btn {
            background: rgba(100, 100, 100, 0.5);
            border: 1px solid rgba(100, 100, 100, 0.8);
        }

        .skip-btn:hover {
            background: rgba(100, 100, 100, 0.7);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(100, 100, 100, 0.3);
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #64c8ff, #b344ff);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .keyboard-shortcuts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .shortcut {
            background: rgba(20, 30, 50, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shortcut-key {
            background: rgba(100, 200, 255, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #64c8ff;
            font-size: 12px;
        }

        .shortcut-action {
            color: #aaa;
            font-size: 13px;
            margin-left: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(20, 30, 50, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            color: #64c8ff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
        }

        .cta-section {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(100, 200, 255, 0.2);
        }

        .cta-button {
            background: linear-gradient(135deg, #64c8ff, #b344ff);
            padding: 15px 50px;
            font-size: 16px;
            margin: 10px;
        }

        .theme-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .theme-box {
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid transparent;
        }

        .theme-box:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .cyberpunk { background: linear-gradient(135deg, #ff006e, #8338ec); }
        .midnight { background: linear-gradient(135deg, #1b2a5b, #0d1f3c); }
        .ocean { background: linear-gradient(135deg, #00b4db, #0083b0); }
        .forest { background: linear-gradient(135deg, #2d6a4f, #1b4332); }
        .sunset { background: linear-gradient(135deg, #ff6b35, #f7931e); }
        .arctic { background: linear-gradient(135deg, #a8dadc, #457b9d); }
        .neon { background: linear-gradient(135deg, #39ff14, #ff10f0); }

        .step-indicator {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }

        .demo-complete {
            text-align: center;
            padding: 40px 20px;
        }

        .demo-complete h2 {
            font-size: 32px;
            color: #64c8ff;
            margin-bottom: 20px;
        }

        .demo-complete p {
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .github-link {
            background: linear-gradient(135deg, #64c8ff, #b344ff);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 25px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .github-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🖥️</div>
            <h1>NovaOS Interactive Demo</h1>
            <p class="subtitle">Experience an AI-Powered Desktop Operating System</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="demoContent"></div>

        <div class="cta-section">
            <p style="color: #aaa; margin-bottom: 20px;">Ready to experience NovaOS?</p>
            <a href="https://github.com/TejashPrakash/NovaOS" class="github-link">
                📥 Clone & Run NovaOS Now
            </a>
        </div>
    </div>

    <script>
        const demoSteps = [
            {
                title: "Welcome to NovaOS",
                icon: "🖥️",
                description: "An intelligent desktop operating system built with Python, featuring a fully integrated AI assistant, 12 built-in applications, and a premium glassmorphism UI.",
                type: "intro"
            },
            {
                title: "🔐 Lock Screen",
                icon: "🔐",
                description: "Glassmorphism design with glowing logo. Live clock display. 3-attempt password lockout. Default password: nova",
                type: "feature"
            },
            {
                title: "🖱️ Desktop Environment",
                icon: "🎨",
                description: "Premium glassmorphism UI with 7 stunning themes. Animated neural background with floating particles. Floating widgets for clock, weather, and AI panel.",
                type: "feature"
            },
            {
                title: "🤖 AI Assistant",
                icon: "🤖",
                description: "34 AI Skills to control your entire OS through natural language. Natural language desktop search (Ctrl+K). Full chat interface with conversation history.",
                type: "feature"
            },
            {
                title: "🪟 Window Management",
                icon: "🖱️",
                description: "Drag, resize, snap, and tile windows with smooth animations. Auto-tiling 2-column grid layout. Window positions saved between sessions.",
                type: "feature"
            },
            {
                title: "12 Built-in Apps",
                icon: "📦",
                description: "Browser 🌐 | Notes 📝 | Calculator 🧮 | Files 📁 | Terminal >_ | Weather 🌤 | Calendar 📅 | Monitor 📊 | Music 🎵 | Viewer 👁 | Tasks 📋 | Settings ⚙️",
                type: "apps"
            },
            {
                title: "🎨 7 Stunning Themes",
                icon: "🎨",
                description: "Customize your desktop with beautiful color schemes designed for maximum visual appeal.",
                type: "themes"
            },
            {
                title: "💡 Smart Features",
                icon: "💡",
                description: "Smart Hub with context-aware suggestions. AI-generated smart notifications. Real-time system monitoring. Right-click AI context menu.",
                type: "feature"
            },
            {
                title: "🖥️ Virtual Desktops",
                icon: "🖥️",
                description: "4 switchable workspaces to organize your workflow. Switch using Ctrl+1/2/3/4. Organize apps across spaces efficiently.",
                type: "feature"
            },
            {
                title: "⌨️ Keyboard Shortcuts",
                icon: "⌨️",
                description: "Master NovaOS with quick keyboard shortcuts for every feature. Everything is just a key combination away.",
                type: "shortcuts"
            },
            {
                title: "📊 Project Stats",
                icon: "📊",
                description: "Discover the technical achievements behind NovaOS.",
                type: "stats"
            },
            {
                title: "🚀 Ready to Install?",
                icon: "🚀",
                description: "Clone the repository and run the interactive demo locally. Full installation takes less than 5 minutes!",
                type: "outro"
            }
        ];

        let currentStep = 0;

        function renderStep(stepIndex) {
            const step = demoSteps[stepIndex];
            const progress = ((stepIndex + 1) / demoSteps.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            let content = '';

            switch(step.type) {
                case 'intro':
                    content = `
                        <div class="demo-section">
                            <div class="carousel">
                                <div class="carousel-content">
                                    <div style="font-size: 80px; margin-bottom: 20px;">✨</div>
                                    <h2 style="font-size: 32px; color: #64c8ff; margin-bottom: 15px;">${step.title}</h2>
                                    <p style="color: #aaa; max-width: 600px; margin: 0 auto; line-height: 1.6;">${step.description}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'apps':
                    content = `
                        <div class="demo-section">
                            <h2>${step.title}</h2>
                            <p style="color: #aaa; margin-bottom: 20px;">${step.description}</p>
                            <div class="feature-grid">
                                <div class="feature-card"><div class="feature-icon">🌐</div><div class="feature-name">Browser</div></div>
                                <div class="feature-card"><div class="feature-icon">📝</div><div class="feature-name">Notes</div></div>
                                <div class="feature-card"><div class="feature-icon">🧮</div><div class="feature-name">Calculator</div></div>
                                <div class="feature-card"><div class="feature-icon">📁</div><div class="feature-name">Files</div></div>
                                <div class="feature-card"><div class="feature-icon">🖥️</div><div class="feature-name">Terminal</div></div>
                                <div class="feature-card"><div class="feature-icon">🌤️</div><div class="feature-name">Weather</div></div>
                            </div>
                        </div>
                    `;
                    break;

                case 'themes':
                    content = `
                        <div class="demo-section">
                            <h2>${step.title}</h2>
                            <p style="color: #aaa; margin-bottom: 20px;">${step.description}</p>
                            <div class="theme-preview">
                                <div class="theme-box cyberpunk">Cyberpunk</div>
                                <div class="theme-box midnight">Midnight</div>
                                <div class="theme-box ocean">Ocean</div>
                                <div class="theme-box forest">Forest</div>
                                <div class="theme-box sunset">Sunset</div>
                                <div class="theme-box arctic">Arctic</div>
                                <div class="theme-box neon">Neon</div>
                            </div>
                        </div>
                    `;
                    break;

                case 'shortcuts':
                    content = `
                        <div class="demo-section">
                            <h2>${step.title}</h2>
                            <div class="keyboard-shortcuts">
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+Space</div>
                                    <div class="shortcut-action">Toggle AI Launcher</div>
                                </div>
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+K</div>
                                    <div class="shortcut-action">AI Desktop Search</div>
                                </div>
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+Shift+L</div>
                                    <div class="shortcut-action">Lock Screen</div>
                                </div>
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+D</div>
                                    <div class="shortcut-action">Start Demo Mode</div>
                                </div>
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+1/2/3/4</div>
                                    <div class="shortcut-action">Switch Virtual Desktop</div>
                                </div>
                                <div class="shortcut">
                                    <div class="shortcut-key">Ctrl+/</div>
                                    <div class="shortcut-action">Show Shortcuts</div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'stats':
                    content = `
                        <div class="demo-section">
                            <h2>${step.title}</h2>
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div class="stat-number">15K+</div>
                                    <div class="stat-label">Lines of Code</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">34</div>
                                    <div class="stat-label">AI Skills</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">12</div>
                                    <div class="stat-label">Built-in Apps</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">7</div>
                                    <div class="stat-label">Themes</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">4</div>
                                    <div class="stat-label">Virtual Desktops</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">6+</div>
                                    <div class="stat-label">Weeks Development</div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'outro':
                    content = `
                        <div class="demo-section demo-complete">
                            <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
                            <h2>Ready to Experience NovaOS?</h2>
                            <p>Clone the repository and run the full interactive demo on your Windows machine (Python 3.10+)</p>
                            <div>
                                <code style="background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; display: inline-block; color: #64c8ff; font-family: monospace;">
                                    git clone https://github.com/TejashPrakash/NovaOS.git && cd NovaOS && python main.py
                                </code>
                            </div>
                            <p style="margin-top: 20px; font-size: 14px;">Then unlock with password: <strong>nova</strong> and press <strong>Ctrl+D</strong></p>
                        </div>
                    `;
                    break;

                default:
                    content = `
                        <div class="demo-section">
                            <div class="carousel">
                                <div class="carousel-content">
                                    <div style="font-size: 60px; margin-bottom: 20px;">${step.icon}</div>
                                    <div class="step-number">#${stepIndex + 1}</div>
                                    <h2 style="font-size: 28px; color: #e0e0e0; margin-bottom: 15px;">${step.title}</h2>
                                    <p style="color: #aaa; max-width: 600px; margin: 0 auto; line-height: 1.6;">${step.description}</p>
                                </div>
                            </div>
                        </div>
                    `;
            }

            document.getElementById('demoContent').innerHTML = content + `
                <div class="carousel-nav">
                    <button class="prev-btn" onclick="previousStep()" ${stepIndex === 0 ? 'disabled' : ''}>&larr; Previous</button>
                    <button class="skip-btn" onclick="skipDemo()">Skip Demo</button>
                    <button class="next-btn" onclick="nextStep()" ${stepIndex === demoSteps.length - 1 ? 'disabled' : ''}>${stepIndex === demoSteps.length - 1 ? '✓ Done' : 'Next &rarr;'}</button>
                </div>
                <div class="step-indicator">${stepIndex + 1} / ${demoSteps.length}</div>
            `;
        }

        function nextStep() {
            if (currentStep < demoSteps.length - 1) {
                currentStep++;
                renderStep(currentStep);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function previousStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function skipDemo() {
            if (confirm('Skip the demo? You can always come back!')) {
                currentStep = demoSteps.length - 1;
                renderStep(currentStep);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextStep();
            if (e.key === 'ArrowLeft') previousStep();
            if (e.key === 'Escape') skipDemo();
        });

        // Initialize
        renderStep(0);
    </script>
</body>
</html>
